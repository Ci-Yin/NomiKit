kotlin.code.style=official
# Increase the maximum memory of Kotlin daemon process (recommended 4-6GB)
kotlin.daemon.jvmargs=-Xmx6g
#Gradle
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=true
# major(1)-minor(pad to 2)-patch(1)-meta(1)
app.id=com.ciyin.nomikit
app.version.name=1.0.0
android.namespace=com.ciyin.app
android.compile.sdk=36
android.min.sdk=26
android.version.code=100000
# JBR must have JCEF bundled
jvm.toolchain.vendor=jetbrains
jvm.toolchain.version=17
# multiplatform-lib-targets.gradle.kts
multiplatform.enable.desktop=true
multiplatform.enable.ios=true
multiplatform.enable.web=false
#multiplatform.enable.js=true
#multiplatform.enable.wasmJs=true
