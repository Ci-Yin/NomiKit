yamlkt = { module = "net.mamoe.yamlkt:yamlkt", version.ref = "yamlkt" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }

# 状态管理、函数式编程与响应式扩展。
# https://github.com/freeletics/FlowRedux
freeletics-flowredux2 = { module = "com.freeletics.flowredux2:flowredux", version.ref = "flowredux2" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-functions = { module = "io.arrow-kt:arrow-functions", version.ref = "arrow" }
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }
arrow-optics-ksp = { module = "io.arrow-kt:arrow-optics-ksp-plugin", version.ref = "arrow" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
rxkotlin = { module = "io.reactivex.rxjava3:rxkotlin", version.ref = "rxkotlin" }
xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissions" }

[bundles]

# UI 常用组合：按页面能力选择引入。
compose = [
    "compose-ui-backhandler",
]

material3 = [
    # "androidx-compose-material3-adaptive-navigation-suite",
    # "androidx-compose-material3-window-size-class2",
    "androidx-compose-material-icons-core",
    "androidx-compose-material-icons-extended"
]

navigation = [
    "jetbrains-navigation3-ui",
    "compose-material3-adaptive-navigation3",
    "jetbrains-lifecycle-viewmodelNavigation3"
]

coil = [
    "coil-compose",
    "coil-network-ktor",
    # "coil-gif",
    # "coil-video"
]

compottie = [
    "compottie"
]

# 文件与图片查看组合。
filekit = [
    "filekit-core",
    "filekit-dialogs",
    "filekit-dialogs-compose",
    # "filekit-coil"
]

zoomimage = [
    "zoomimage-compose",
    "zoomimage-compose-coil3",
    "zoomimage-compose-coil3-core",
]

# 数据与脚本组合。
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]

kotlin-scripting = [
    "kotlin-scripting-common",
    "kotlin-scripting-jsr223",
    "kotlin-scripting-dependencies-maven",
    "kotlin-scripting-dependencies",
    "kotlin-scripting-jvm-host",
    "kotlin-scripting-jvm"
]

# 函数式与响应式组合。
arrow = [
    "arrow-core",
    "arrow-functions",
    "arrow-optics",
    # "arrow-optics-ksp"
]

rxjava = [
    "rxjava",
    "rxkotlin"
]

[plugins]

# Android / Compose 插件。
# https://developer.android.com/build/releases/gradle-plugin
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Kotlin / KSP 插件。
# https://kotlinlang.org/docs/gradle-configure-project.html
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# 数据库与打包插件。
room = { id = "androidx.room" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
